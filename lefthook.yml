pre-commit:
  jobs:
    - name: biome
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: check
      run: pnpm check
    - name: typecheck
      run: pnpm exec tsc --noEmit
    - name: test
      run: pnpm test

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
